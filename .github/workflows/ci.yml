name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e ".[transport,dev]"

      - name: Lint
        run: ruff check src tests examples

      - name: Check formatting
        run: ruff format --check src tests examples

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import importlib.metadata as m; import vstarcamctl; assert vstarcamctl.__version__ == m.version('vstarcamctl')"
          vstarcamctl --help >/dev/null

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[transport,dev]"

      - name: Run tests
        run: pytest -q
