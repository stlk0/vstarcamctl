[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vstarcamctl"
version = "0.1.0"
description = "Local PPPP/CGI control tools for VStarcam-compatible cameras"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "VStarcamCtl contributors"}]
keywords = ["vstarcam", "pppp", "cgi", "ip-camera", "rtsp", "onvif", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Networking",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/stlk0/vstarcamctl"
Documentation = "https://github.com/stlk0/vstarcamctl/tree/main/docs"
Repository = "https://github.com/stlk0/vstarcamctl"
Issues = "https://github.com/stlk0/vstarcamctl/issues"
Changelog = "https://github.com/stlk0/vstarcamctl/blob/main/CHANGELOG.md"

[project.optional-dependencies]
transport = ["aiopppp==0.2.3"]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "twine>=6.0",
]
all = ["aiopppp==0.2.3"]

[project.scripts]
vstarcamctl = "vstarcamctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vstarcamctl = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
