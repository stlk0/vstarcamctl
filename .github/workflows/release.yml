name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify annotated release tag and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import re
          import tomllib
          from datetime import date
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          pattern = rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})$"
          heading = re.search(pattern, Path("CHANGELOG.md").read_text(), re.MULTILINE)
          if heading is None:
              raise SystemExit(f"CHANGELOG has no dated {version} release heading")
          date.fromisoformat(heading[1])
          PY

      - name: Reject private artifacts and credential signatures
        run: python scripts/release_checks.py tree

      - name: Install verification tools
        run: python -m pip install -e ".[provisioning,dev]"

      - name: Verify source
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
          coverage run -m pytest -q --disable-socket --allow-unix-socket
          coverage report

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/release_checks.py distributions
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/python -c "from vstarcamctl.command_catalog import CommandCatalog; CommandCatalog.load()"
          .release-smoke/bin/vstarcamctl --version

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vstarcamctl
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
